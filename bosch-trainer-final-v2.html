var OBJE=[["Why pay more for Serie 8?","The oven heats 40% faster (Hybrid), cleans itself (Catalytic) and has a 4-level Wok burner, none of which competitors offer."],["Serie 6 vs Serie 8?","Serie 8 has Hybrid Cooking and two spits. Serie 6 has Wok and Catalytic (in HGX3G8W50S)."],["How do I clean the oven?","Catalytic: grease turns to ash at 180° or above and wipes off. The inner glass shelf in the door is removable."],["Installation?","Natural gas: contact the gas company. Cylinder: change the jets. The legs must be fitted for ventilation."],["Safety?","Full Safety cuts the gas to the hob and oven if the flame goes out for any reason."]];
var OBE={2:[["Why pay more for Serie 8?","Intelligent Programme learns from your feedback, Power Control sets water pressure in basket zones, Zeolith dries plastic, and Extra Clean Zone handles heavy soil."],["Do I need to pre-rinse the dishes?","No. You can load dishes without rinsing, and Pre-treatment does an initial rinse up to 30 minutes (on some models)."],["I'm worried about leaks","AquaStop is 100% guaranteed against water leaks and stops the machine if one happens (on some models, see the comparison table)."],["Sound and motor?","EcoSilence Drive is a quiet, efficient motor with a 10-year warranty."]],3:[["Why Vario Inverter?","The compressor adjusts its speed to demand: energy saving, quiet and longer life."],["Vegetables spoil fast","VitaFresh Plus keeps them fresh up to 21 days and VitaFresh up to 14 days, depending on the model."],["Our power supply fluctuates","KGN39NLEE8 works from 187 to 264 V with a thermal fuse to protect the compressor."],["My kitchen is tight","Perfect Fit and a reversible door let the fridge fit anywhere."]],4:[["The oven gets dirty","Catalytic turns grease into ash at 180° or above (partial or full depending on the model)."],["I want healthy cooking","Air Fry uses little oil, and Steam goes up to 120° on some models like HSG7361B1."],["The hood is weak","Power depends on installation: avoid pipe bends, the wrong diameter and long pipes, and slope the pipe downwards."]],5:[["The coffee is bitter","Aroma Double Shot gives strong coffee with less bitterness, and CeramDrive grinds finely for full flavour."],["Cleaning the machine is hard","Auto Milk Clean uses steam after every drink, and the Calc'n Clean programme cleans and descales."],["I want variety in drinks","TQE80703 has 36 drinks and 30 favourites, and CTL7181B0 has 35 drinks."]],6:[["I have children or allergies","The ULPA filter cleans the air by 99.99%, and Toy Guard (BGL41WFAMP) stops small toys being sucked in."],["I want a vacuum that also mops","Unlimited 7 Aqua cleans and mops 2-in-1 with a 250 ml water tank."],["Does the vacuum last?","10-year motor warranty on the vacuums listed, and a 7-year expected lifespan."]],7:[["The hand blender overheats","Ceramic connect and motor overheat protection, plus a 10-year motor warranty on MSM6M633 and MSM6M831."],["Air fryer or oven?","MAF671B0 has a 7.2 L capacity, a lit viewing window and a dishwasher-safe pot."],["Will the kitchen machine handle my dough?","MUMS6ZS34 has a 5.5 L bowl and takes up to 3.5 kg dough and 1.5 kg flour."]]};
