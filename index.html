<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e20015">

<title>Bosch Trainer AI 2026</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="top">
    bosch-logo.webp
  </div>
</header>

<main class="wrap">

  <section class="hero">

    <div class="hero-title">
      <h1>Bosch Trainer AI 2026</h1>
      <h3>BSH Egypt Training Team</h3>
    </div>

    <h2>دليل التدريب والمقارنة 2026</h2>

    <p>
      ابحث برقم الموديل أو الميزة، افتح الشرح الكامل،
      واحفظ أو قارن الموديلات.
    </p>

    <div class="stats" id="stats"></div>

  </section>

  <div class="controls">

    <input
      id="q"
      placeholder="ابحث: SMS8YDI82T أو Home Connect أو Air Fry..."
    >

    <select id="cat">
      <option value="">كل الفئات</option>
    </select>

    <button id="favOnly" class="outline">
      المفضلة فقط
    </button>

  </div>

  <div id="grid" class="grid"></div>

</main>

<div id="drawer" class="drawer">
  <div class="panel" id="panel"></div>
</div>

<div id="compareBar" class="compare" hidden>
  <span id="compareCount"></span>
  <button id="showCompare">عرض المقارنة</button>
</div>

<footer>

  <strong>Bosch Trainer AI 2026</strong>
  <br>
  Developed for BSH Egypt Training Team

  <br><br>

  For support and training inquiries:

  <br>

  <a href="mailto:mahmoud.wagdy-ext@bshg.com">
    mahmoud.wagdy-ext@bshg.com
  </a>

</footer>

<script src="app.js"></script>

</body>
</html>
